<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="SilverPlay - catálogo de streamings e apps em vídeo vertical.">
    <title>SilverPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0b0a;
            --surface: #17140f;
            --accent: #3ee0ff;
            --brass: #e0c17a;
            --text: #f6f1e8;
            --muted: #c4b7a6;
            --side: clamp(14px, 4vw, 48px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            background:
                radial-gradient(900px 420px at 8% 0, rgba(62,224,255,.12), transparent 60%),
                radial-gradient(700px 380px at 100% 0, rgba(224,193,122,.12), transparent 55%),
                var(--bg);
        }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        a { color: inherit; }
        /* ===== CABEÇALHO ===== */
        header {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
            padding: 14px var(--side);
            background: rgba(12,11,10,.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .logo { font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
        .logo span { color: var(--accent); }
        .search {
            flex: 1 1 220px; max-width: 460px; padding: 11px 18px; border-radius: 30px; font-size: 16px;
            color: var(--text); background: rgba(255,255,255,.05); border: 1px solid rgba(246,241,232,.14);
            outline: none;
        }
        .search:focus-visible { border-color: var(--accent); }
        /* ===== CATEGORIAS ===== */
        .category-bar {
            display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
            padding: 14px var(--side);
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex: 0 0 auto; cursor: pointer; white-space: nowrap;
            padding: 9px 18px; border-radius: 30px;
            font-size: 14px; font-weight: 600; color: var(--text);
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(62,224,255,.3);
            transition: background .2s, border-color .2s;
        }
        .cat-btn.active {
            color: #041316; background: linear-gradient(135deg, #3ee0ff, #1499c4);
            border-color: transparent; box-shadow: 0 8px 18px rgba(62,224,255,.24);
        }
        /* ===== HERO (PLAYER + INFORMAÇÕES) ===== */
        .hero {
            --player-h: clamp(480px, calc(100svh - 190px), 860px);
            max-width: 1400px; margin: 0 auto; padding: 14px var(--side) 0;
        }
        /* Player 9:16 (gravações de tela do celular) */
        .monitor {
            position: relative; margin: 0 auto;
            width: min(100%, calc(66vh * 9 / 16));
            width: min(100%, calc(66svh * 9 / 16));
            aspect-ratio: 9 / 16;
            border-radius: 14px; overflow: hidden; background: #000;
            box-shadow: 0 28px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(224,193,122,.32);
        }
        .video-wrapper { position: absolute; inset: 0; background: #000; }
        .video-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .hero-info { min-width: 0; margin-top: 20px; }
        .kicker { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
        .hero-title {
            font-family: 'Fraunces', Georgia, serif; font-size: clamp(30px, 4vw, 52px);
            font-weight: 700; line-height: 1.02; margin-top: 10px; overflow-wrap: anywhere;
        }
        .meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .tag {
            display: inline-block; padding: 5px 12px; border-radius: 30px;
            font-size: 12px; font-weight: 600; color: var(--brass);
            border: 1px solid rgba(224,193,122,.45);
        }
        .tag-soft { color: var(--muted); border-color: rgba(246,241,232,.14); }
        .hero-desc { margin-top: 16px; max-width: 70ch; color: var(--muted); font-size: 16px; line-height: 1.6; }
        .facts {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px;
            margin-top: 22px; padding-top: 20px; border-top: 1px solid rgba(246,241,232,.1);
        }
        .facts dt { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
        .facts dd { margin-top: 4px; font-size: 16px; font-weight: 600; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 12px 26px; border-radius: 30px; border: 0; cursor: pointer;
            font-size: 15px; font-weight: 800; text-decoration: none;
            transition: border-color .2s, color .2s;
        }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .btn-play { background: var(--accent); color: #041316; }
        .btn-next { color: var(--text); background: transparent; border: 1px solid rgba(246,241,232,.2); }
        .btn-next:hover { border-color: var(--accent); color: var(--accent); }
        /* Lista "A seguir" */
        .up-next { margin-top: 28px; }
        .up-next h2 {
            margin-bottom: 10px; font-size: 12px; font-weight: 700;
            letter-spacing: .18em; text-transform: uppercase; color: var(--brass);
        }
        .up-next ul { list-style: none; display: grid; gap: 8px; }
        .up-next button {
            width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: 12px; text-align: left;
            background: rgba(255,255,255,.03); border: 1px solid rgba(246,241,232,.08);
            transition: border-color .2s, background .2s;
        }
        .up-next button:hover { border-color: rgba(62,224,255,.5); background: rgba(62,224,255,.06); }
        .up-title { font-size: 15px; font-weight: 600; }
        .up-cat { font-size: 12px; color: var(--muted); white-space: nowrap; }
        /* ===== CATÁLOGO ===== */
        .catalog { max-width: 1400px; margin: 0 auto; padding: 40px var(--side) 60px; }
        .row-title {
            font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600;
            margin-bottom: 18px; border-left: 5px solid var(--accent); padding-left: 10px; line-height: 1.2;
        }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
        .video-card {
            display: flex; flex-direction: column; text-align: left; color: var(--text);
            background: var(--surface); border: 1px solid rgba(255,255,255,.07); border-radius: 16px;
            overflow: hidden; cursor: pointer;
            transition: transform .25s, border-color .25s, box-shadow .25s;
        }
        .video-card:focus-visible, .video-card.playing { border-color: var(--accent); }
        .video-card.playing { box-shadow: 0 0 0 1px var(--accent), 0 12px 30px rgba(62,224,255,.14); }
        @media (hover: hover) {
            .video-card:hover { transform: scale(1.05); border-color: var(--accent); }
        }
        .thumb {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: linear-gradient(135deg, #221c16, #12333a);
        }
        /* Fundo borrado + imagem inteira (vertical) para não cortar a capa */
        .thumb-bg {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
            filter: blur(18px) brightness(.55); transform: scale(1.15);
        }
        .thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
        .play-dot {
            position: absolute; z-index: 1; width: 44px; height: 44px; border-radius: 50%;
            display: grid; place-items: center; background: var(--accent); color: #041316;
            box-shadow: 0 6px 16px rgba(0,0,0,.4);
        }
        @media (hover: hover) {
            .play-dot { opacity: 0; transition: opacity .2s; }
            .video-card:hover .play-dot, .video-card:focus-visible .play-dot { opacity: 1; }
        }
        .video-card.playing .play-dot { opacity: 1; }
        .badge {
            display: none; position: absolute; z-index: 1; left: 8px; bottom: 8px;
            padding: 4px 8px; border-radius: 4px; background: var(--accent);
            color: #000; font-size: 11px; font-weight: 800;
        }
        .playing .badge { display: block; }
        .card-info { display: block; padding: 12px; }
        .card-title { display: block; font-size: 15px; font-weight: 600; }
        .card-subtitle {
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            margin-top: 5px; font-size: 13px; line-height: 1.4; color: var(--muted);
        }
        .vazio { grid-column: 1 / -1; padding: 20px 0; color: var(--muted); }
        /* ===== COMPUTADOR: player 9:16 à esquerda, informações ao lado ===== */
        @media (min-width: 981px) {
            .hero {
                display: grid; grid-template-columns: auto minmax(0, 1fr);
                gap: clamp(28px, 3.5vw, 56px); align-items: center; padding-top: 28px;
            }
            .monitor {
                width: calc(var(--player-h) * 9 / 16);
                height: var(--player-h);
                aspect-ratio: auto;
                margin: 0;
            }
            .hero-info { margin-top: 0; }
        }
        /* ===== CELULAR ===== */
        @media (max-width: 980px) {
            .hero { padding: 10px var(--side) 0; }
        }
        @media (max-width: 600px) {
            .search { flex-basis: 100%; max-width: none; }
            .hero-actions .btn { flex: 1 1 100%; }
            .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .card-info { padding: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Silver<span>Play</span></div>
        <input class="search" id="busca" type="search" placeholder="Buscar título" aria-label="Buscar título">
    </header>
    <nav class="category-bar" id="categorias" aria-label="Categorias"></nav>
    <main>
        <section class="hero">
            <div class="monitor">
                <div class="video-wrapper">
                    <iframe id="main-player" title="Player de vídeo"
                        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>
                </div>
            </div>
            <div class="hero-info">
                <p class="kicker">Em cartaz</p>
                <h1 class="hero-title" id="info-titulo"></h1>
                <div class="meta-row">
                    <span class="tag" id="info-tag"></span>
                    <span class="tag tag-soft">Vertical 9:16</span>
                </div>
                <p class="hero-desc" id="info-desc"></p>
                <dl class="facts">
                    <div><dt>Categoria</dt><dd id="info-categoria"></dd></div>
                    <div><dt>Posição</dt><dd id="info-posicao"></dd></div>
                    <div><dt>Formato</dt><dd>Vertical 9:16</dd></div>
                    <div><dt>Tipo</dt><dd>Gravação de tela do celular</dd></div>
                </dl>
                <div class="hero-actions">
                    <button class="btn btn-play" id="btn-play" type="button">▶ Assistir Agora</button>
                    <button class="btn btn-next" id="btn-next" type="button">Próximo</button>
                    <a class="btn btn-next" id="info-link" href="#" target="_blank" rel="noopener noreferrer">Abrir no Vimeo</a>
                </div>
                <section class="up-next" aria-label="Próximos vídeos">
                    <h2>A seguir</h2>
                    <ul id="proximos"></ul>
                </section>
            </div>
        </section>
        <section class="catalog">
            <h2 class="row-title" id="titulo-categoria"></h2>
            <div class="video-grid" id="grid-videos"></div>
        </section>
    </main>
    <script>
        /* =========================================================
           👇 CONFIGURAÇÃO DOS SEUS VÍDEOS 👇
           Capa manual (opcional): capa: "url-da-imagem"
           Vídeo não listado: use o link completo, com o código no final.
           ========================================================= */
        const meusVideos = [
            { titulo: "APPLE TV", sub: "Entretenimento que conquista audiência e se destaca no mercado com a inconfundível qualidade Apple.", categoria: "APPLE TV", link: "https://vimeo.com/1249813502" },
            { titulo: "LEITURA 360", sub: "O aplicativo ideal para acompanhar notícias e revistas direto na palma da sua mão.", categoria: "LEITURA 360", link: "https://vimeo.com/1249814247" },
            { titulo: "O JORNALISTA", sub: "O aplicativo que conta com os principais jornais do país, notícias e podcast.", categoria: "APPLE TV", link: "https://vimeo.com/1249814358" },
            { titulo: "CINDIE", sub: "Uma plataforma com diversos filmes e séries premiadas independentes do mundo todo, para você conhecer.", categoria: "CINDIE", link: "https://vimeo.com/1249813506" },
            { titulo: "DISNEY", sub: "Um serviço de streaming por assinatura oferecido pela Disney. Com diversos filmes, séries, para a toda família.", categoria: "DISNEY", link: "https://vimeo.com/1249813797" },
            { titulo: "GLOBOPLAY", sub: "O melhor conteúdo em um streaming brasileiro, onde você encontra programação ao vivo, novelas, séries, realities, esportes e muito mais!", categoria: "GLOBOPLAY", link: "https://vimeo.com/1249814019" },
            { titulo: "QUEIMA DIARIA", sub: "Uma plataforma com programas de exercícios para fazer em casa.", categoria: "QUEIMA DIARIA", link: "https://vimeo.com/1249814381" },
            { titulo: "DEEZER", sub: "Um serviço de streaming de áudio com muitas músicas e podcasts para você ouvir quando e onde estiver.", categoria: "DEEZER", link: "https://vimeo.com/1249813504" },
            { titulo: "FLUID", sub: "Um serviço de assinatura que disponibiliza conteúdo digital para ajudar no equilíbrio físico, mental e emocional.", categoria: "FLUID", link: "https://vimeo.com/1249814016" },
            { titulo: "DOCWAY", sub: "Uma solução de saúde digital que oferece pronto atendimento por áudio e vídeo.", categoria: "DOCWAY", link: "https://vimeo.com/1249813895" },
            { titulo: "UNIVERSAL+", sub: "É o streaming da NBCUniversal com séries, filmes e originais para assistir quando e onde quiser.", categoria: "UNIVERSAL+", link: "https://vimeo.com/1249814562" },
            { titulo: "KIDDLE PASS", sub: "Uma plataforma onde é possível ter acesso, em poucos cliques, a experiências educacionais ao vivo e em vídeo, para crianças, disponíveis de maneira prática, simples e segura.", categoria: "KIDDLE PASS", link: "https://vimeo.com/1249814189" },
            { titulo: "HOTGO", sub: "Conteúdo adulto premium em streaming, com privacidade, segurança e um catálogo variado para você aproveitar do seu jeito.", categoria: "HOTGO", link: "https://vimeo.com/1249814072" },
            { titulo: "HBO MAX", sub: "Um serviço de vídeo sob demanda global que traz diversão para a família toda com filmes, séries e muito mais.", categoria: "HBO MAX", link: "https://vimeo.com/1249814052" },
            { titulo: "HUB VANTAGENS", sub: "O HUB Vantagens é a sua nova plataforma de benefícios que reúne todas as vantagens que seus clientes já conhecem.", categoria: "HUB VANTAGENS", link: "https://vimeo.com/1249814071" },
            { titulo: "ESTUDA+", sub: "O Estuda + traz uma série de ebooks elaborados por professores altamente capacitados.", categoria: "ESTUDA+", link: "https://vimeo.com/1249813975" },
            { titulo: "CURTAON", sub: "Um canal independente, dedicado às artes, cultura e humanidades com conteúdos para entreter e aprender.", categoria: "CURTAON", link: "https://vimeo.com/1249813501" }
        ];
        /* =========================================================
           👇 CÓDIGO DA PÁGINA 👇
           ========================================================= */
        const $ = id => document.getElementById(id);
        const player = $('main-player');
        const grid = $('grid-videos');
        const categorias = ['Todos', ...new Set(meusVideos.map(v => v.categoria))];
        const cacheCapas = new Map();
        let categoria = 'Todos';
        let busca = '';
        let atual = meusVideos[0];
        let autoplay = false;
        // Extrai o ID e o código (vídeo não listado) de um link do Vimeo
        function extrairVimeo(url) {
            const id = url.match(/vimeo\.com\/(?:[^?#]*\/)?(\d+)(?=$|[\/?#])/);
            if (!id) return null;
            const hash = url.match(/[?&]h=([a-zA-Z0-9]+)/) || url.match(/vimeo\.com\/(?:video\/)?\d+\/([a-zA-Z0-9]+)/);
            return { id: id[1], hash: hash ? hash[1] : null };
        }
        function linkDoPlayer(url, tocar) {
            const v = extrairVimeo(url);
            if (!v) return url;
            const p = new URLSearchParams({ autoplay: tocar ? 1 : 0, playsinline: 1, title: 0, byline: 0, portrait: 0, badge: 0, vimeo_logo: 0, share: 0, like: 0, watchlater: 0 });
            if (v.hash) p.set('h', v.hash);
            return `https://player.vimeo.com/video/${v.id}?${p}`;
        }
        // Capa: manual, do cache ou via oEmbed do Vimeo
        async function buscarCapa(video) {
            if (video.capa) return video.capa;
            if (cacheCapas.has(video.link)) return cacheCapas.get(video.link);
            const r = await fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(video.link)}&width=640`);
            if (!r.ok) throw new Error('oEmbed respondeu ' + r.status);
            const url = (await r.json()).thumbnail_url;
            if (!url) throw new Error('Sem thumbnail');
            cacheCapas.set(video.link, url);
            return url;
        }
        const normalizar = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        const listaDaCategoria = nome => nome === 'Todos' ? meusVideos : meusVideos.filter(v => v.categoria === nome);
        const el = (tag, classe, texto) => {
            const e = document.createElement(tag);
            if (classe) e.className = classe;
            if (texto !== undefined) e.textContent = texto;
            return e;
        };
        // Atualiza o player (só recarrega se o endereço mudou)
        function renderPlayer() {
            const url = linkDoPlayer(atual.link, autoplay);
            if (player.getAttribute('src') !== url) player.src = url;
        }
        // Atualiza as informações ao lado do player
        function renderInfo() {
            const posicao = meusVideos.indexOf(atual);
            $('info-titulo').textContent = atual.titulo;
            $('info-tag').textContent = atual.categoria;
            $('info-desc').textContent = atual.sub;
            $('info-categoria').textContent = atual.categoria;
            $('info-posicao').textContent = `${posicao + 1} de ${meusVideos.length}`;
            $('info-link').href = atual.link;
            const lista = $('proximos');
            lista.innerHTML = '';
            const total = Math.min(3, meusVideos.length - 1);
            for (let i = 1; i <= total; i++) {
                const v = meusVideos[(posicao + i) % meusVideos.length];
                const li = el('li');
                const botao = el('button');
                botao.type = 'button';
                botao.append(el('span', 'up-title', v.titulo), el('span', 'up-cat', v.categoria));
                botao.onclick = () => selecionar(v, true);
                li.append(botao);
                lista.append(li);
            }
        }
        // Marca o card que está tocando
        function marcarCards() {
            grid.querySelectorAll('.video-card').forEach(c => {
                const ativo = c.dataset.link === atual.link;
                c.classList.toggle('playing', ativo);
                c.setAttribute('aria-pressed', ativo);
            });
        }
        function selecionar(video, tocar) {
            atual = video;
            autoplay = tocar;
            renderPlayer();
            renderInfo();
            marcarCards();
        }
        function criarCard(video) {
            const card = el('button', 'video-card');
            card.type = 'button';
            card.dataset.link = video.link;
            const thumb = el('span', 'thumb');
            thumb.append(el('span', 'play-dot', '▶'), el('span', 'badge', 'SELECIONADO'));
            const info = el('span', 'card-info');
            info.append(el('span', 'card-title', video.titulo), el('span', 'card-subtitle', video.sub));
            card.append(thumb, info);
            card.onclick = () => {
                selecionar(video, true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            carregarCapa(video, thumb);
            return card;
        }
        async function carregarCapa(video, thumb) {
            try {
                const url = await buscarCapa(video);
                const fundo = new Image();
                fundo.className = 'thumb-bg';
                fundo.alt = '';
                fundo.loading = 'lazy';
                fundo.src = url;
                const img = new Image();
                img.className = 'thumb-img';
                img.alt = video.titulo;
                img.loading = 'lazy';
                img.src = url;
                thumb.prepend(fundo, img);
            } catch (erro) {
                console.warn('Capa não carregada:', video.titulo, erro);
            }
        }
        // Monta os cards conforme categoria e busca
        function renderGrid() {
            const termo = normalizar(busca.trim());
            const lista = listaDaCategoria(categoria).filter(v => normalizar(v.titulo).includes(termo));
            $('titulo-categoria').textContent = categoria === 'Todos' ? 'Todos os Vídeos' : `Categoria: ${categoria}`;
            grid.innerHTML = '';
            lista.forEach(v => grid.append(criarCard(v)));
            if (!lista.length) grid.append(el('p', 'vazio', 'Nenhum vídeo encontrado.'));
            marcarCards();
        }
        // Botões de categoria
        function renderCategorias() {
            const nav = $('categorias');
            categorias.forEach(nome => {
                const botao = el('button', 'cat-btn', nome === 'Todos' ? '✨ Todos' : nome);
                botao.type = 'button';
                botao.dataset.nome = nome;
                botao.onclick = () => trocarCategoria(nome);
                nav.append(botao);
            });
            marcarCategoria();
        }
        function marcarCategoria() {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.nome === categoria));
        }
        function trocarCategoria(nome) {
            categoria = nome;
            marcarCategoria();
            const primeiro = listaDaCategoria(nome)[0];
            if (primeiro) selecionar(primeiro, false);
            renderGrid();
        }
        $('busca').oninput = e => {
            busca = e.target.value;
            renderGrid();
        };
        $('btn-play').onclick = () => selecionar(atual, true);
        $('btn-next').onclick = () => {
            const i = meusVideos.indexOf(atual);
            selecionar(meusVideos[(i + 1) % meusVideos.length], true);
        };
        renderCategorias();
        selecionar(atual, false);
        renderGrid();
    </script>
</body>
</html>
